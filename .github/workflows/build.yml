name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sabit imza anahtari (guncellemeler eski uygulamanin ustune kurulsun)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Capacitor projesi olustur
        run: |
          mkdir www
          cat > www/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <meta name="theme-color" content="#0f2744">
          <title>TCDD Asistanı</title>
          <style>
          :root{--navy:#0f2744;--navy2:#1d3f6e;--red:#c8102e;--cream:#f5f2ea;--ink:#1c2430;--muted:#6b7686;--line:#e6e1d4;--green:#1f8a5b;--gold:#d9a400;--card:#fff}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0}
          body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
          button{font-family:inherit;cursor:pointer}
          button:active{transform:scale(.97)}
          svg{display:block}
          .top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0f274455;border-bottom:3px solid var(--red)}
          .top .tt{font-size:19px;font-weight:700;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .ibtn{background:#ffffff1f;border:none;color:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
          .wrap{padding:16px;max-width:720px;margin:auto}
          .hero{background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 76px;position:relative;border-bottom:4px solid var(--red)}
          .hero .row1{display:flex;align-items:center;gap:14px}
          .logo{width:58px;height:58px;filter:drop-shadow(0 4px 8px #0006)}
          .ht{font-size:25px;font-weight:800;letter-spacing:.3px}
          .hs{font-size:13px;opacity:.75;margin-top:2px}
          .hero .ibtn{margin-left:auto}
          .datechip{position:absolute;left:18px;bottom:42px;font-size:13px;opacity:.85}
          .home{margin-top:-30px;padding:0 16px 24px;max-width:720px;margin-left:auto;margin-right:auto}
          .mcard{display:flex;align-items:center;gap:16px;width:100%;border:none;border-radius:22px;padding:20px;margin-bottom:14px;text-align:left;color:#fff;box-shadow:0 8px 22px #0003;position:relative;overflow:hidden}
          .mcard::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:#ffffff14}
          .mcard .mi{width:56px;height:56px;border-radius:16px;background:#ffffff26;display:flex;align-items:center;justify-content:center;flex:none}
          .mcard b{display:block;font-size:21px;letter-spacing:.2px}
          .mcard small{display:block;font-size:13px;opacity:.88;margin-top:3px}
          .c-red{background:linear-gradient(135deg,#c8102e,#e23a52)}
          .c-wine{background:linear-gradient(135deg,#8c1d2f,#c8472f)}
          .c-navy{background:linear-gradient(135deg,#1d3f6e,#2f66ad)}
          .c-green{background:linear-gradient(135deg,#17744c,#2aa874);padding:16px 20px}
          .c-green .mi{width:46px;height:46px}
          .chip{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:600;font-size:14px}
          .chip.p{background:#fff3cf;border:1.5px solid var(--gold);color:#6b4e00}
          .chip.f{background:#fde8eb;border:1.5px solid var(--red);color:#8c1d2f}
          .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #1c243014;border:1px solid var(--line);position:relative}
          .card.act{border-left:6px solid var(--green)}
          .card.closed{border-left:6px solid #2563eb}
          .small{font-size:13px;color:var(--muted)}
          .btn{border:none;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:650;background:var(--navy2);color:#fff;display:inline-flex;align-items:center;gap:6px}
          .btn.red{background:var(--red)}.btn.gray{background:#8a93a1}.btn.green{background:var(--green)}.btn.ghost{background:#eef0f4;color:var(--ink)}.btn.big{width:100%;justify-content:center;padding:16px;font-size:18px;border-radius:16px}
          .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
          input,textarea{font-size:16px;padding:11px 12px;border:1.5px solid #d6d1c3;border-radius:12px;width:100%;font-family:inherit;background:#fff;color:var(--ink);outline:none}
          input:focus,textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px #1d3f6e22}
          textarea{min-height:76px;resize:vertical}
          label.small{display:block;margin:12px 0 5px;font-weight:600}
          .search{position:relative;margin-bottom:14px}
          .search input{padding-left:42px}
          .search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
          .entry{padding:0;overflow:hidden}
          .eh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,#f1ede1,#fbf9f3);border-bottom:1px solid var(--line)}
          .num{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
          .edate{font-weight:700;font-size:17px;flex:1}
          .sbtn{border:none;background:#fff;border:1px solid var(--line);width:36px;height:36px;border-radius:10px;color:var(--navy2);display:flex;align-items:center;justify-content:center}
          .sbtn.d{color:var(--red)}
          .eb{padding:12px 14px 14px}
          .fl{margin:8px 0;white-space:pre-wrap;line-height:1.45}
          .fl b{color:var(--navy2)}
          .mal{margin:6px 0 0 0;padding-left:0;list-style:none}
          .mal li{padding:3px 0 3px 18px;position:relative}
          .mal li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--red)}
          .pr{display:flex;align-items:center;gap:10px;margin:10px 0}
          .pr>label{min-width:128px;font-weight:650;font-size:14px;color:var(--navy2)}
          .inw{position:relative;flex:1}
          .inw input{padding-right:34px;text-align:right;font-weight:650}
          .inw em{position:absolute;right:12px;top:11px;font-style:normal;color:var(--muted);font-weight:700}
          .tbox{margin-top:12px;display:flex;align-items:center;gap:10px;background:#0f27440d;border:1.5px dashed #1d3f6e55;border-radius:14px;padding:10px 12px}
          .tbox .tl{font-size:12px;color:var(--muted);font-weight:600}
          .tbox .tv{font-size:21px;font-weight:800;color:var(--red)}
          .tbox .tw{flex:1}
          .hl{outline:3px solid var(--gold);outline-offset:2px}
          .sum{background:linear-gradient(135deg,#fff8dc,#fff3c2);border:1.5px solid var(--gold)}
          .sum .tot{font-size:22px;font-weight:800;color:var(--red)}
          .pend{display:flex;align-items:center;gap:12px;padding:6px 0;color:#6b4e00;font-weight:600}
          .pend .sp2{width:26px;height:26px;border-radius:50%;border:4px solid #d9a40033;border-top-color:var(--gold);animation:sp .9s linear infinite;flex:none}
          .failm{color:#8c1d2f;font-weight:600;margin:4px 0 10px;line-height:1.4}
          #fab{position:fixed;right:18px;bottom:calc(90px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#17744c,#2aa874);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 8px 20px #0005;z-index:20;touch-action:none;user-select:none;border:3px solid #fff}
          #modal{position:fixed;inset:0;background:#0b1626a6;display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
          #modal.show{display:flex}
          #modal .box{background:#fff;width:100%;max-width:720px;border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
          #modal .box::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:#d6d1c3;margin:6px auto 12px}
          #modal h3{margin:4px 0 8px;font-size:20px;color:var(--navy)}
          @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
          .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#f4f2ec;border:none;border-radius:14px;padding:16px;margin:8px 0;font-size:16px;font-weight:600;color:var(--ink)}
          img.prev{width:100%;border-radius:14px;border:1px solid var(--line)}
          #loader{position:fixed;inset:0;background:#0b1626d9;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:90;gap:18px;text-align:center;padding:30px}
          #loader.show{display:flex}
          .spin{width:54px;height:54px;border-radius:50%;border:5px solid #ffffff33;border-top-color:#fff;animation:sp 0.9s linear infinite}
          @keyframes sp{to{transform:rotate(360deg)}}
          #toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:#111d;color:#fff;padding:12px 20px;border-radius:30px;font-size:15px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:88%;text-align:center}
          #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
          /* sesli ekleme */
          .tip{background:#e8f0fb;border:1px solid #c5d6ee;color:#1d3f6e;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:14px}
          .vf{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px;margin-bottom:14px;box-shadow:0 2px 10px #1c243010}
          .vh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
          .vh b{color:var(--navy2);font-size:16px}
          .mic{width:48px;height:48px;border-radius:50%;border:none;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 10px #1d3f6e55}
          .mic.on{background:var(--red);animation:pulse 1.1s ease-in-out infinite}
          @keyframes pulse{0%{box-shadow:0 0 0 0 #c8102e88}70%{box-shadow:0 0 0 16px #c8102e00}100%{box-shadow:0 0 0 0 #c8102e00}}
          .lst{font-size:13px;font-weight:600;color:var(--red);min-height:18px;margin:2px 0 6px}
          .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#f5f2eaf2;border-top:1px solid var(--line);z-index:6}
          #disp{background:linear-gradient(150deg,#0f2744,#1d3f6e);color:#fff;border-radius:22px;padding:18px;text-align:right;min-height:112px;word-break:break-all;margin-bottom:14px;box-shadow:0 6px 18px #0f274455;display:flex;flex-direction:column;justify-content:flex-end}
          #disp small{font-size:17px;opacity:.65;min-height:22px}
          #disp .v{font-size:38px;font-weight:700}
          .calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
          .calc button{padding:20px 0;font-size:24px;border:none;border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 2px 6px #1c24301f;font-weight:600}
          .calc .op{background:var(--navy2);color:#fff}.calc .eq{background:var(--green);color:#fff}.calc .cl{background:#fde8eb;color:var(--red)}

          /* açılış ekranı */
          #splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 36%,#1f4577 0%,#0f2744 52%,#07162a 100%);color:#fff;transition:opacity .4s ease;overflow:hidden}
          #splash.out{opacity:0;pointer-events:none}
          #splash::before,#splash::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#c8102e,transparent);opacity:.9}
          #splash::before{top:calc(28px + env(safe-area-inset-top))}
          #splash::after{bottom:calc(28px + env(safe-area-inset-bottom))}
          .slogo{width:132px;height:132px;filter:drop-shadow(0 10px 24px #000a) drop-shadow(0 0 28px #3a6bb577);animation:sLogo .9s cubic-bezier(.2,.9,.3,1.2) both}
          .sglow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#3a6bb533,transparent 68%);top:calc(50% - 250px);animation:sFade 1.4s ease both}
          .stitle{margin:34px 0 0;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(27px,8vw,38px);line-height:1.2;letter-spacing:.8px;text-wrap:balance;text-shadow:0 3px 14px #000a;animation:sUp .9s ease .5s both}
          .stitle span{display:block;background:linear-gradient(180deg,#fff 45%,#dbe8fb 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
          .sdiv{display:flex;align-items:center;gap:12px;margin:20px 0 16px;animation:sFade .8s ease .95s both}
          .sdiv i{display:block;height:2px;width:0;background:linear-gradient(90deg,transparent,#e23a52);animation:sLine .9s ease 1s forwards}
          .sdiv i:last-child{background:linear-gradient(90deg,#e23a52,transparent)}
          .sdiv b{width:11px;height:11px;transform:rotate(45deg);background:#c8102e;box-shadow:0 0 14px #e23a52}
          .ssub{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(16px,4.6vw,20px);letter-spacing:1.4px;color:#a9c1e3;animation:sUp .9s ease 1.25s both}
          @keyframes sLogo{from{opacity:0;transform:scale(.55) translateY(16px)}to{opacity:1;transform:none}}
          @keyframes sUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
          @keyframes sFade{from{opacity:0}to{opacity:1}}
          @keyframes sLine{to{width:68px}}
          </style>
          </head>
          <body>
          <div id="splash"></div>
          <div id="app"></div>
          <div id="fab"></div>
          <div id="modal"><div class="box" id="mbox"></div></div>
          <div id="loader"><div class="spin"></div><div id="ltext" style="font-size:18px;font-weight:600">Yükleniyor…</div></div>
          <div id="toast"></div>
          <input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
          <input type="file" id="restore" accept=".json,application/json" style="display:none">

          <script>
          /* ===== sabitler ===== */
          // Yerleşik yedek anahtar. Ayarlar'a yazılan anahtar her zaman önce kullanılır; Ayarlar boşsa bu kullanılır.
          const EMBED='AQ.Ab8RN6JVjTPY2vM4opReUleLktGUHAbkZ4hg8yTzESfEnMq_Dw';
          const FALLBACK_MODELS=['gemini-3.8-flash','gemini-3.6-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-2.5-flash','gemini-2.5-flash-lite'];
          const FONT='system-ui,Roboto,"Segoe UI",Arial,sans-serif';
          const I={
          cam:'<path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/>',
          mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>',
          folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
          calc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7.5h8M8 12h1M12 12h1M16 12h0M8 16h1M12 16h1M16 16h0"/>',
          back:'<path d="M15 5l-7 7 7 7"/>',
          plus:'<path d="M12 5v14M5 12h14"/>',
          trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
          edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
          gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
          check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
          search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
          dots:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
          sw:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
          undo:'<path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/>',
          share:'<circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/>',
          clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
          warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
          retry:'<path d="M20 5v5h-5M4 19v-5h5"/><path d="M5.6 9A7 7 0 0 1 19 10M18.4 15A7 7 0 0 1 5 14"/>'
          };
          const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
          const LOGO='<svg class="logo" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a6bb5"/><stop offset="1" stop-color="#0b1d36"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lg)"/><rect x="13.5" y="9" width="21" height="24" rx="6.5" fill="#fff"/><rect x="16.5" y="13" width="15" height="8.5" rx="2.2" fill="#0f2744"/><circle cx="19.5" cy="28" r="2" fill="#c8102e"/><circle cx="28.5" cy="28" r="2" fill="#c8102e"/><path d="M17.5 33l-3.5 6.5M30.5 33l3.5 6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M10 41.5h28" stroke="#c8102e" stroke-width="3" stroke-linecap="round"/></svg>';

          const $=s=>document.querySelector(s);
          const p2=n=>String(n).padStart(2,'0');
          const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const CAP=()=>window.Capacitor&&window.Capacitor.Plugins||{};
          function load(){try{return Object.assign({files:[],calc:[],trash:[],key:'',draft:null,mc:null},JSON.parse(localStorage.getItem('tcddAsistan')))}catch(e){return{files:[],calc:[],trash:[],key:'',draft:null,mc:null}}}
          let S=load();
          function save(){try{localStorage.setItem('tcddAsistan',JSON.stringify(S))}catch(e){toast('Kayıt hatası: depolama dolu olabilir')}}
          try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
          const getKey=()=>(S.key&&S.key.trim())||EMBED;
          const isDone=e=>!e.status||e.status==='done';
          function fdate(ts){const d=new Date(ts);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)}
          function fnum(n){return n==null||n===''?'':Number(n).toLocaleString('tr-TR',{maximumFractionDigits:2})}
          function pnum(s){if(s==null)return null;s=String(s).trim().replace(/\s/g,'').replace(/\./g,'').replace(',','.');if(s==='')return null;const n=parseFloat(s);return isNaN(n)?null:n}
          const r2=n=>Math.round(n*100)/100;
          const activeFile=()=>S.files.find(f=>f.active);
          const getFile=id=>S.files.find(f=>f.id===id);
          function ensureActive(){
            let f=activeFile();
            if(!f){f={id:uid(),name:'Dosya '+(S.files.length+1),created:Date.now(),active:true,closed:false,entries:[],summaries:[]};S.files.push(f)}
            return f;
          }
          let tt=null;
          function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
          function showLoader(t){$('#ltext').textContent=t||'Yükleniyor…';$('#loader').classList.add('show')}
          function hideLoader(){$('#loader').classList.remove('show')}

          /* ===== görüntü deposu (IndexedDB) – kuyruktaki fotoğraflar uygulama kapansa da kalır ===== */
          const memImgs={};
          let _db=null;
          function idb(){
            if(_db)return _db;
            _db=new Promise((res,rej)=>{
              try{
                const rq=indexedDB.open('tcddimgs',1);
                rq.onupgradeneeded=()=>rq.result.createObjectStore('i');
                rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
              }catch(e){rej(e)}
            });
            return _db;
          }
          async function idbPut(k,v){memImgs[k]=v;try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('i','readwrite');t.objectStore('i').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
          async function idbGet(k){if(memImgs[k])return memImgs[k];try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('i').objectStore('i').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
          async function idbDel(k){delete memImgs[k];try{const db=await idb();await new Promise(res=>{const t=db.transaction('i','readwrite');t.objectStore('i').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}}

          /* ===== gezinme + geri tuşu ===== */
          let view={name:'home'},stack=[],lastBack=0;
          function go(v){stack.push(view);view=v;render();window.scrollTo(0,0);try{history.pushState({},'')}catch(e){}}
          function modalOpen(){return $('#modal').classList.contains('show')}
          function handleBack(){
            if($('#splash'))return;
            if($('#loader').classList.contains('show'))return;
            if(modalOpen()){closeModal();return}
            if(stack.length){view=stack.pop();render();return}
            const now=Date.now();
            if(now-lastBack<2000){const A=CAP().App;if(A&&A.exitApp)A.exitApp()}
            else{lastBack=now;toast('Çıkmak için tekrar geri tuşuna basın')}
          }
          try{history.pushState({},'');window.addEventListener('popstate',()=>{try{history.pushState({},'')}catch(e){}handleBack()})}catch(e){}
          function openModal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show')}
          function closeModal(){$('#modal').classList.remove('show');if(needRender){needRender=false;softRender()}}
          $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
          function topbar(title,extra){return `<div class="top"><button class="ibtn" onclick="handleBack()">${ic('back',24)}</button><div class="tt">${title}</div>${extra||''}</div>`}

          let needRender=false;
          function typing(){const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.id!=='cam'&&a.id!=='restore'}
          function softRender(){
            if(modalOpen()||typing()){needRender=true;return}
            if(view.name==='home'||view.name==='file'||view.name==='files')render();
          }
          document.addEventListener('focusout',()=>{setTimeout(()=>{if(needRender&&!typing()&&!modalOpen()){needRender=false;softRender()}},300)});

          function counts(){
            let p=0,f=0;
            S.files.forEach(x=>x.entries.forEach(e=>{if(e.status==='pending')p++;else if(e.status==='failed')f++}));
            return {p,f};
          }
          function render(){
            if(view.name!=='voice')stopMic();
            $('#fab').style.display='none';
            const a=$('#app');
            if(view.name==='home'){
              const nf=S.files.length,ne=S.files.reduce((s,f)=>s+f.entries.filter(isDone).length,0);
              const c=counts();
              const dt=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
              a.innerHTML=`<div class="hero"><div class="row1">${LOGO}<div><div class="ht">TCDD Asistanı</div><div class="hs">Tadilat formu • otomatik kayıt</div></div><button class="ibtn" onclick="settings()">${ic('gear')}</button></div><div class="datechip">${dt}</div></div>
              <div class="home">
              ${c.p?`<div class="chip p">${ic('clock',22)}<span>${c.p} form okunuyor, arka planda kaydedilecek</span></div>`:''}
              ${c.f?`<div class="chip f" onclick="go({name:'files'})">${ic('warn',22)}<span>${c.f} form okunamadı. Dosyalar'dan tekrar deneyin</span></div>`:''}
              <button class="mcard c-red" onclick="addTcdd()"><span class="mi">${ic('cam',30)}</span><span><b>TCDD Ekle</b><small>Formun fotoğrafını çek, otomatik işlensin</small></span></button>
              <button class="mcard c-wine" onclick="go({name:'voice'})"><span class="mi">${ic('mic',30)}</span><span><b>TCDD Ekle</b><small>Konuşarak ekle (mikrofon)</small></span></button>
              <button class="mcard c-navy" onclick="go({name:'files'})"><span class="mi">${ic('folder',30)}</span><span><b>Dosyalar</b><small>${nf} dosya • ${ne} madde</small></span></button>
              <button class="mcard c-green" onclick="go({name:'calc'})"><span class="mi">${ic('calc',26)}</span><span><b style="font-size:18px">Hesap Makinesi</b></span></button></div>`;
            }
            else if(view.name==='files')renderFiles();
            else if(view.name==='file')renderFile();
            else if(view.name==='voice')renderVoice();
            else if(view.name==='calc')renderCalc();
          }

          /* ===== Ayarlar + yedek ===== */
          function settings(){
            let h=`<h3>Ayarlar</h3>
            <p class="small">El yazısı okuma: <b>${getKey()?'hazır':'anahtar yok'}</b> · Kullanılan anahtar: <b>${S.key&&S.key.trim()?'senin yazdığın':(EMBED?'uygulamadaki yerleşik':'yok')}</b></p>
            <label class="small">Gemini API anahtarı</label>
            <p class="small" style="margin:0 0 6px">Buraya yazdığın anahtar her zaman öncelikli kullanılır. Eski anahtar bozulursa yenisini buraya yapıştırman yeter.</p>
            <input id="keyin" placeholder="Buraya yapıştır" value="${esc(S.key)}">
            <div class="row" style="margin-top:12px"><button class="btn green" onclick="saveKey()">Kaydet</button><button class="btn ghost" onclick="closeModal()">Kapat</button></div>
            <h3 style="margin-top:22px">Yedek</h3>
            <p class="small">Tüm dosyalarını telefona yedekle ya da yedekten geri yükle.</p>
            <button class="opt" onclick="backupAll()">${ic('share')} Tüm verileri yedekle</button>
            <button class="opt" onclick="$('#restore').click()">${ic('undo')} Yedekten geri yükle</button>`;
            if(S.trash.length){
              h+=`<h3 style="margin-top:22px">Silinen dosyalar (${S.trash.length})</h3>`;
              S.trash.forEach(f=>h+=`<div class="opt"><span style="flex:1">${esc(f.name)}<div class="small">${f.entries.length} madde</div></span><button class="btn" onclick="restoreFile('${f.id}')">${ic('undo',18)} Geri al</button></div>`);
            }
            openModal(h);
          }
          function saveKey(){
            S.key=$('#keyin').value.trim();
            S.files.forEach(f=>f.entries.forEach(e=>{if(e.status==='failed'&&/anahtar/i.test(e.job&&e.job.err||'')){e.status='pending';e.job.tries=0;e.job.next=0}}));
            save();closeModal();toast('Kaydedildi');render();kick();
          }
          function restoreFile(id){
            const f=S.trash.find(x=>x.id===id);if(!f)return;
            S.trash=S.trash.filter(x=>x.id!==id);f.active=false;f.closed=true;S.files.push(f);save();closeModal();render();toast('Dosya geri alındı');
          }
          async function backupAll(){
            try{
              const data=JSON.stringify({v:1,files:S.files,trash:S.trash},null,1);
              const bytes=new TextEncoder().encode(data);
              await shareBytes('TCDD_Asistani_yedek_'+fdate(Date.now()).replace(/\./g,'-')+'.json',bytes,'application/json','TCDD Asistanı yedek');
            }catch(e){alert('Yedek alınamadı: '+e.message)}
          }
          $('#restore').addEventListener('change',async e=>{
            const f=e.target.files[0];if(!f)return;
            try{
              const j=JSON.parse(await f.text());
              if(!j||!Array.isArray(j.files))throw new Error('Geçersiz yedek dosyası');
              let n=0;const have=new Set(S.files.map(x=>x.id));
              j.files.forEach(x=>{if(!have.has(x.id)){x.active=false;x.closed=true;S.files.push(x);n++}});
              save();closeModal();render();toast(n+' dosya geri yüklendi');
            }catch(err){alert('Geri yüklenemedi: '+err.message)}
            e.target.value='';
          });

          /* ===== Fotoğraftan ekleme: kuyruk ===== */
          let pendingImg=null;
          function addTcdd(){$('#cam').value='';$('#cam').click()}
          $('#cam').addEventListener('change',e=>{
            const f=e.target.files[0];if(!f)return;
            const rd=new FileReader();
            rd.onload=()=>{const im=new Image();im.onload=()=>{
              const m=2000,sc=Math.min(1,m/Math.max(im.width,im.height));
              const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
              c.getContext('2d').drawImage(im,0,0,c.width,c.height);
              pendingImg=c.toDataURL('image/jpeg',0.92);
              openModal(`<h3>Fotoğrafı kontrol et</h3><p class="small">Yazılar net okunuyorsa Tamam'a bas.</p><img class="prev" src="${pendingImg}">
              <div class="row" style="margin-top:14px"><button class="btn green" onclick="confirmImg()">${ic('check',18)} Tamam</button><button class="btn ghost" onclick="closeModal();addTcdd()">Tekrar çek</button><button class="btn red" onclick="closeModal()">İptal</button></div>`);
            };im.src=rd.result};
            rd.readAsDataURL(f);
          });
          async function confirmImg(){
            if(!pendingImg)return;
            closeModal();
            const jid=uid(),img=pendingImg;pendingImg=null;
            await idbPut(jid,img);
            const f=ensureActive();
            f.entries.push({id:uid(),ts:Date.now(),date:fdate(Date.now()),adres:'',tanim:'',islem:'',malz:[],malzFiyat:null,iscFiyat:null,toplam:null,status:'pending',job:{img:jid,tries:0,next:0,err:''}});
            save();
            toast('Fotoğraf alındı, arka planda okunuyor');
            render();kick();
          }
          const OCR_PROMPT=`Sen, Türkiye'de TCDD / Marmaray vagon bakım atölyelerinden gelen el yazılı "Bakım-Onarım-İmalat Tadilat Formu"nu okuyan uzman bir transkripsiyoncusun.
          El yazısı özensiz, eğik, bitişik veya silik olabilir. Harfleri tek tek değil, kelimenin ve cümlenin bağlamından, tesisat / vagon bakım dili ve rakam-miktar mantığından yararlanarak en olası doğru şekilde çöz. Sık geçen kelimeler: klozet, klozet taşı, klozet kapağı, iç takım, rezervuar, flex hortum, silikon, musluk, batarya, lavabo, sifon, gider, tıkalı, kırık, arıza, tespit edildi, değiştirildi, giderildi, kullanıma aktif, erkek WC, bay WC, yolcu WC, vagon, atölye, kontrol, montaj, izolasyon, çatı, dere, havluluk, fotoselli, gişe.

          Sadece formun elle yazılmış alanlarını oku, basılı şablon yazılarını (başlıklar, logolar) yok say:
          - adres: "Adres" alanı
          - is_tanimi: "Yapılacak İşin Tanımı" alanı
          - yapilan_islem: "Yapılan İşlemler" alanı
          - malzemeler: "Kullanılan Malzemeler" alanı; her malzeme ayrı bir dizi elemanı olsun, "1 Adet Klozet Taşı" biçiminde miktarıyla birlikte. Malzeme yazılmamışsa boş dizi.
          Fiyat, imza, form numarası, tarih ve firma alanlarını alma.

          Kurallar: Düzgün Türkçe imla ve noktalama kullan (cümle başı büyük harf, özel adlar ve kısaltmalar doğru). Anlamı değiştirme, yazılmayan bir şey ekleme, uydurma. Bir kelimeyi hiç çözemiyorsan en olası okumayı yaz. Sadece geçerli JSON döndür, başka metin yazma:
          {"adres":"","is_tanimi":"","yapilan_islem":"","malzemeler":[]}
          Fotoğraf bu tür bir form değilse veya hiç okunamıyorsa {"hata":"kısa sebep"} döndür.`;
          async function gfetch(url,opt,ms){
            const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms||40000);
            try{return await fetch(url,Object.assign({signal:ac.signal},opt||{}))}
            catch(e){const x=new Error(e&&e.name==='AbortError'?'Zaman aşımı (internet yavaş veya erişim yok)':'İnternet bağlantısı yok veya erişilemiyor');x.net=true;throw x}
            finally{clearTimeout(t)}
          }
          async function modelList(key){
            if(S.mc&&S.mc.l&&S.mc.l.length&&Date.now()-S.mc.t<12*3600*1000)return S.mc.l;
            const names=[];let ok=false;
            try{
              const r=await gfetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}},15000);
              if(r.ok){
                ok=true;const j=await r.json();
                (j.models||[]).forEach(m=>{
                  const n=(m.name||'').replace('models/','');
                  if(/^gemini-[\d.]+-flash(-lite)?$/.test(n)&&(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0)names.push(n);
                });
              }
            }catch(e){}
            names.sort((x,y)=>parseFloat(y.split('-')[1])-parseFloat(x.split('-')[1])||(x.indexOf('lite')>0)-(y.indexOf('lite')>0));
            FALLBACK_MODELS.forEach(n=>{if(names.indexOf(n)<0)names.push(n)});
            const l=names.slice(0,8);
            if(ok){S.mc={t:Date.now(),l:l};save()}
            return l;
          }
          async function ocrCall(key,b64){
            const models=await modelList(key);
            const errs=[];let retry=false;
            for(const m of models){
              let r,j={};
              try{
                r=await gfetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},
                  body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:b64}},{text:OCR_PROMPT}]}],generationConfig:{temperature:0,responseMimeType:'application/json'}})},50000);
              }catch(e){errs.push(e.message);retry=true;break}
              try{j=await r.json()}catch(e){}
              if(!r.ok){
                const msg=(j.error&&j.error.message)||('HTTP '+r.status);errs.push(m+': '+msg);
                if(r.status===401||r.status===403||(r.status===400&&/API key/i.test(msg))){const e=new Error('Anahtar reddedildi: '+msg);e.fatal=true;throw e}
                if(r.status===404)S.mc=null;
                if(r.status===429||r.status>=500)retry=true;
                continue;
              }
              const c=(j.candidates||[])[0];
              const t=((c&&c.content&&c.content.parts)||[]).map(x=>x.text||'').join('');
              const mm=t.match(/\{[\s\S]*\}/);
              if(!mm){errs.push(m+': boş yanıt');retry=true;continue}
              try{return JSON.parse(mm[0])}catch(e){errs.push(m+': okunamayan yanıt');retry=true}
            }
            const e=new Error(errs.slice(0,3).join(' | ')||'Okuma yapılamadı');e.retry=retry;throw e;
          }
          let running=false,runStart=0,rt=null;
          function pendingList(){const a=[];S.files.forEach(f=>f.entries.forEach(e=>{if(e.status==='pending'&&e.job)a.push([f,e])}));return a}
          function failJob(e,msg){e.status='failed';e.job=e.job||{};e.job.err=msg;save()}
          function stillThere(f,e){return S.files.indexOf(f)>=0&&f.entries.indexOf(e)>=0&&e.status==='pending'}
          async function processOne(f,e){
            const key=getKey();
            if(!key){failJob(e,"Okuma anahtarı yok. Ayarlar'dan Gemini anahtarını yazın.");return}
            const img=await idbGet(e.job.img);
            if(!img){failJob(e,'Fotoğraf bulunamadı, elle girebilirsiniz.');return}
            const tok=uid();e.job.tok=tok;
            let d;
            try{d=await ocrCall(key,img.split(',')[1])}
            catch(err){
              if(!stillThere(f,e)||e.job.tok!==tok)return;
              if(err.fatal||!err.retry){failJob(e,err.message);return}
              e.job.tries=(e.job.tries||0)+1;e.job.err=err.message;
              if(e.job.tries>=8)failJob(e,err.message);
              else{e.job.next=Date.now()+Math.min(60000,4000*e.job.tries);save()}
              return;
            }
            if(!stillThere(f,e)||e.job.tok!==tok)return;
            if(!d||d.hata){failJob(e,'Okunamadı: '+((d&&d.hata)||'boş sonuç'));return}
            e.adres=String(d.adres||'');e.tanim=String(d.is_tanimi||'');e.islem=String(d.yapilan_islem||'');
            e.malz=(Array.isArray(d.malzemeler)?d.malzemeler:[]).map(String).filter(x=>x.trim());
            const jid=e.job.img;e.status='done';e.job=null;save();idbDel(jid);
            toast('Bir form okundu ve kaydedildi');
          }
          async function runQueue(){
            if(running&&Date.now()-runStart<120000)return;
            running=true;runStart=Date.now();
            try{
              for(let guard=0;guard<50;guard++){
                const now=Date.now();
                const it=pendingList().find(x=>(x[1].job.next||0)<=now);
                if(!it)break;
                await processOne(it[0],it[1]);
                runStart=Date.now();
              }
            }catch(e){}
            running=false;updateWake();softRender();
            const nx=pendingList().map(x=>x[1].job.next||0).filter(t=>t>Date.now());
            if(nx.length){clearTimeout(rt);rt=setTimeout(kick,Math.max(500,Math.min(...nx)-Date.now()+50))}
          }
          function kick(){updateWake();runQueue()}
          let wl=null;
          async function updateWake(){
            try{
              const need=pendingList().length>0;
              if(need&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
              else if(!need&&wl){await wl.release();wl=null}
            }catch(e){}
          }
          function resumeAll(){pendingList().forEach(x=>{x[1].job.next=0});running=false;kick()}
          document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeAll()});
          window.addEventListener('online',resumeAll);
          try{const A=CAP().App;if(A&&A.addListener)A.addListener('appStateChange',s=>{if(s&&s.isActive)resumeAll()})}catch(e){}
          setInterval(()=>{if(pendingList().length)kick()},10000);

          function retryJob(fid,eid){
            const e=getFile(fid).entries.find(x=>x.id===eid);
            e.status='pending';e.job=e.job||{img:null};e.job.tries=0;e.job.next=0;e.job.err='';save();render();kick();
          }

          /* ===== Elle / sesle form ===== */
          function entryFormHtml(d,onsave){return `<h3>${onsave==='saveEdit'?'Maddeyi düzenle':'Bilgileri gir'}</h3>
          <label class="small">Adres</label><input id="f_adres" value="${esc(d.adres)}">
          <label class="small">Yapılacak işin tanımı</label><textarea id="f_tanim">${esc(d.tanim)}</textarea>
          <label class="small">Yapılan işlem</label><textarea id="f_islem">${esc(d.islem)}</textarea>
          <label class="small">Kullanılan malzemeler (her satıra bir tane; yoksa boş bırak)</label><textarea id="f_malz" style="min-height:110px">${esc((d.malz||[]).join('\n'))}</textarea>
          <div class="row" style="margin-top:14px"><button class="btn green" onclick="${onsave}()">Kaydet</button><button class="btn ghost" onclick="closeModal()">İptal</button></div>`}
          function readFormVals(){return{adres:$('#f_adres').value.trim(),tanim:$('#f_tanim').value.trim(),islem:$('#f_islem').value.trim(),malz:$('#f_malz').value.split('\n').map(x=>x.trim()).filter(x=>x)}}
          function saveEntry(d){
            const f=ensureActive();
            f.entries.push({id:uid(),ts:Date.now(),date:fdate(Date.now()),adres:d.adres,tanim:d.tanim,islem:d.islem,malz:d.malz,malzFiyat:null,iscFiyat:null,toplam:null});
            save();return f;
          }

          /* ===== Sesle ekleme ===== */
          const vs={field:null,want:false,nat:false,web:null,base:'',sep:' ',fail:0};
          const SR=()=>CAP().SpeechRecognition;
          function renderVoice(){
            const d=S.draft||{};
            const fld=(k,label,rows)=>`<div class="vf"><div class="vh"><b>${label}</b><button class="mic" id="m_${k}" onclick="toggleMic('${k}')">${ic('mic',24)}</button></div><div class="lst" id="s_${k}"></div><textarea id="v_${k}" rows="${rows}" oninput="draftSave()">${esc(d[k]||'')}</textarea></div>`;
            $('#app').innerHTML=topbar('Konuşarak Ekle')+`<div class="wrap"><div class="tip">Mikrofon simgesine bas ve konuş. Tekrar basınca dinleme durur. Yazıyı istediğin gibi düzeltebilirsin. En son <b>Dosyaya kaydet</b>'e bas.</div>`
            +fld('adres','Adres',2)+fld('tanim','Yapılacak işin tanımı',3)+fld('islem','Yapılan işlem',3)+fld('malz','Kullanılan malzemeler (her satıra bir tane)',4)
            +`<div style="height:100px"></div></div><div class="bar"><button class="btn green big" onclick="saveVoice()">${ic('check',22)} Dosyaya kaydet</button></div>`;
          }
          function draftSave(){
            S.draft={adres:($('#v_adres')||{}).value||'',tanim:($('#v_tanim')||{}).value||'',islem:($('#v_islem')||{}).value||'',malz:($('#v_malz')||{}).value||''};
            save();
          }
          function saveVoice(){
            stopMic();
            const d={adres:$('#v_adres').value.trim(),tanim:$('#v_tanim').value.trim(),islem:$('#v_islem').value.trim(),malz:$('#v_malz').value.split('\n').map(x=>x.trim()).filter(x=>x)};
            if(!d.adres&&!d.tanim&&!d.islem&&!d.malz.length){toast('Form boş');return}
            const f=saveEntry(d);S.draft=null;save();
            toast('Dosyaya kaydedildi');
            view={name:'file',id:f.id,scrollLast:true};render();window.scrollTo(0,0);
          }
          function setLst(k,t){const el=$('#s_'+k);if(el)el.textContent=t||''}
          function micUI(){
            document.querySelectorAll('.mic').forEach(b=>b.classList.remove('on'));
            ['adres','tanim','islem','malz'].forEach(k=>setLst(k,''));
            if(vs.want&&vs.field){const b=$('#m_'+vs.field);if(b)b.classList.add('on');setLst(vs.field,'Dinleniyor… durdurmak için mikrofona bas')}
          }
          function fmtSpeech(t,fresh){
            t=String(t||'').trim();if(!t)return t;
            return fresh?t.charAt(0).toLocaleUpperCase('tr')+t.slice(1):t;
          }
          function applyPartial(t){
            const el=$('#v_'+vs.field);if(!el||!t)return;
            vs.fail=0;
            const fresh=!vs.base||vs.sep==='\n';
            el.value=vs.base?vs.base+vs.sep+fmtSpeech(t,fresh):fmtSpeech(t,true);
            draftSave();
          }
          function commitBase(){const el=$('#v_'+vs.field);vs.base=el?el.value.trimEnd():''}
          async function toggleMic(k){
            if(vs.want&&vs.field===k){await stopMic();return}
            if(vs.want)await stopMic();
            startMic(k);
          }
          async function startMic(k){
            vs.field=k;vs.sep=k==='malz'?'\n':' ';vs.want=true;vs.fail=0;commitBase();micUI();
            const P=SR();
            if(P){
              try{
                const av=await P.available();
                if(av&&av.available===false)throw new Error('yok');
                let perm=await P.checkPermissions();
                if(!perm||perm.speechRecognition!=='granted')perm=await P.requestPermissions();
                if(!perm||perm.speechRecognition!=='granted'){toast('Mikrofon izni gerekli');vs.want=false;micUI();return}
                vs.nat=true;
                if(!vs.listener){vs.listener=true;P.addListener('partialResults',d=>{if(vs.want&&vs.nat){const t=(d&&d.matches&&d.matches[0])||'';applyPartial(t)}})}
                nativeLoop();return;
              }catch(e){vs.nat=false}
            }
            const R=window.SpeechRecognition||window.webkitSpeechRecognition;
            if(R){
              try{
                const r=new R();r.lang='tr-TR';r.continuous=true;r.interimResults=true;
                r.onresult=ev=>{let t='';for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript+' ';applyPartial(t.trim())};
                r.onend=()=>{if(vs.want&&vs.web===r){commitBase();try{r.start()}catch(e){}}};
                r.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){toast('Mikrofon izni verilmedi');stopMic()}};
                vs.web=r;r.start();return;
              }catch(e){}
            }
            vs.want=false;micUI();
            const el=$('#v_'+k);if(el)el.focus();
            toast('Sesle yazma bu cihazda yok. Klavyedeki mikrofon tuşunu kullanın');
          }
          async function nativeLoop(){
            const P=SR();
            while(vs.want&&vs.nat){
              try{
                commitBase();
                await P.start({language:'tr-TR',maxResults:1,partialResults:true,popup:false});
              }catch(e){
                vs.fail++;
                if(vs.fail>5){toast('Ses algılanamadı, tekrar deneyin');stopMic();return}
                await sleep(500);continue;
              }
              await sleep(600);
              while(vs.want&&vs.nat){
                let l=true;try{const s=await P.isListening();l=s&&s.listening!==false}catch(e){}
                if(!l)break;
                await sleep(400);
              }
              if(!vs.want)break;
              await sleep(200);
            }
          }
          async function stopMic(){
            const was=vs.want;vs.want=false;
            try{const P=SR();if(P&&vs.nat)await P.stop()}catch(e){}
            try{if(vs.web){const w=vs.web;vs.web=null;w.onend=null;w.stop()}}catch(e){}
            vs.nat=false;
            if(was){micUI();if($('#v_adres'))draftSave()}
          }

          /* ===== Dosyalar ===== */
          function fileRange(f){
            const ts=f.entries.filter(isDone).map(e=>e.ts);
            if(!ts.length)return 'Henüz işlem yok';
            return 'Başlangıç: '+fdate(Math.min(...ts))+'  •  Son işlem: '+fdate(Math.max(...ts));
          }
          function renderFiles(){
            let h=topbar('Dosyalar',`<button class="btn green" onclick="newFile()">${ic('plus',18)} Dosya</button>`)+'<div class="wrap">';
            if(!S.files.length)h+='<div class="card"><p class="small" style="margin:0">Henüz dosya yok. "TCDD Ekle" ile ilk kaydı eklediğinizde otomatik açılır ya da yukarıdan dosya ekleyebilirsiniz.</p></div>';
            S.files.forEach(f=>{
              const np=f.entries.filter(e=>e.status==='pending').length,nf=f.entries.filter(e=>e.status==='failed').length;
              h+=`<div class="card ${f.active?'act':'closed'}" data-id="${f.id}">
              <div class="row"><b style="font-size:18px;flex:1">${esc(f.name)} ${f.closed?`<span style="color:#2563eb;vertical-align:middle">${ic('check',20)}</span>`:''}</b>
              <span class="small" style="font-weight:700;color:${f.active?'var(--green)':'#2563eb'}">${f.active?'Aktif':'Kapalı'}</span>
              <button class="sbtn" onclick="event.stopPropagation();fileMenu('${f.id}')">${ic('dots',20)}</button></div>
              <div class="small" style="margin-top:6px">${fileRange(f)}</div><div class="small">${f.entries.filter(isDone).length} madde${np?' • '+np+' okunuyor':''}${nf?' • '+nf+' okunamadı':''}</div></div>`;
            });
            $('#app').innerHTML=h+'</div>';
            document.querySelectorAll('.card[data-id]').forEach(c=>{
              let t=null,lp=false;
              const id=c.dataset.id;
              c.addEventListener('pointerdown',()=>{lp=false;t=setTimeout(()=>{lp=true;fileMenu(id)},550)});
              ['pointerup','pointerleave','pointermove','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>clearTimeout(t)));
              c.addEventListener('click',()=>{if(!lp)go({name:'file',id})});
            });
          }
          function newFile(){
            const n=prompt('Dosya adı:','Dosya '+(S.files.length+1));if(n===null)return;
            const cur=activeFile();
            S.files.push({id:uid(),name:n||'Dosya',created:Date.now(),active:!cur,closed:false,entries:[],summaries:[]});
            save();render();
          }
          function fileMenu(id){
            const f=getFile(id);
            openModal(`<h3>${esc(f.name)}</h3>
            <button class="opt" onclick="shareFile('${id}')">${ic('share')} Paylaş (salt okunur PDF)</button>
            ${f.active?`<button class="opt" onclick="switchFile('${id}')">${ic('sw')} Diğer dosyaya geç</button>`:`<button class="opt" onclick="reactivate('${id}')">${ic('undo')} Dosyayı tekrar aktif yap</button>`}
            <button class="opt" onclick="renameFile('${id}')">${ic('edit')} Adı değiştir</button>
            <button class="opt" style="color:var(--red)" onclick="delFile('${id}')">${ic('trash')} Dosyayı sil</button>`);
          }
          function renameFile(id){closeModal();const f=getFile(id);const n=prompt('Yeni ad:',f.name);if(n){f.name=n;save();render()}}
          function switchFile(id){
            const others=S.files.filter(x=>x.id!==id);
            let h='<h3>Hangi dosyaya geçilsin?</h3>';
            others.forEach(o=>h+=`<button class="opt" onclick="doSwitch('${id}','${o.id}')">${ic('folder')} ${esc(o.name)}</button>`);
            h+=`<button class="opt" onclick="doSwitch('${id}','new')">${ic('plus')} Yeni dosya aç</button>`;
            openModal(h);
          }
          function doSwitch(from,to){
            const f=getFile(from);f.active=false;f.closed=true;
            if(to==='new'){S.files.push({id:uid(),name:'Dosya '+(S.files.length+1),created:Date.now(),active:true,closed:false,entries:[],summaries:[]})}
            else{const t=getFile(to);t.active=true;t.closed=false}
