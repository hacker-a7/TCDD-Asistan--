          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/filesystem @capacitor/share @capacitor-community/speech-recognition --legacy-peer-deps
          npx cap init "TCDD Asistani" com.tcdd.asistan --web-dir www
          if [ -f capacitor.config.json ]; then node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.backgroundColor='#0f2744';fs.writeFileSync(f,JSON.stringify(c,null,2))"; fi
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android

