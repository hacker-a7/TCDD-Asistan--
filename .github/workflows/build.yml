            });
            f.entries.forEach((e,i)=>{
              const head=`<div class="eh"><div class="num">${i+1}</div><div class="edate">${esc(e.date)}</div>`;
              if(e.status==='pending'){
                h+=`<div class="card entry" id="e_${e.id}" data-date="${esc(e.date)}">${head}<button class="sbtn d" onclick="delEntry('${f.id}','${e.id}')">${ic('trash',18)}</button></div>
                <div class="eb"><div class="pend"><div class="sp2"></div><div>El yazısı okunuyor… Uygulamadan çıksan da devam eder.${e.job&&e.job.tries?`<div class="small">Deneme ${e.job.tries}: ${esc(e.job.err)}</div>`:''}</div></div></div></div>`;
                return;
              }
              if(e.status==='failed'){
                h+=`<div class="card entry" id="e_${e.id}" data-date="${esc(e.date)}">${head}<button class="sbtn d" onclick="delEntry('${f.id}','${e.id}')">${ic('trash',18)}</button></div>
                <div class="eb"><div class="failm">${ic('warn',18)} ${esc(e.job&&e.job.err||'Okunamadı')}</div>
                <div class="row"><button class="btn" onclick="retryJob('${f.id}','${e.id}')">${ic('retry',18)} Tekrar dene</button><button class="btn ghost" onclick="editEntry('${f.id}','${e.id}')">${ic('edit',18)} Elle gir</button></div></div></div>`;
                return;
              }
              h+=`<div class="card entry" id="e_${e.id}" data-date="${esc(e.date)}">${head}
              <button class="sbtn" onclick="editEntry('${f.id}','${e.id}')">${ic('edit',18)}</button>
              <button class="sbtn d" onclick="delEntry('${f.id}','${e.id}')">${ic('trash',18)}</button></div>
              <div class="eb">
              <div class="fl"><b>Adres :</b> ${esc(e.adres)}</div>
              <div class="fl"><b>Yapılacak işin tanımı :</b> ${esc(e.tanim)}${e.islem?'\n'+esc(e.islem):''}</div>
              ${e.malz.length?`<ul class="mal">${e.malz.map(m=>'<li>'+esc(m)+'</li>').join('')}</ul>`:''}
              ${e.malz.length?`<div class="pr"><label>Malzeme Fiyatı :</label><div class="inw"><input inputmode="decimal" placeholder="Fiyat" value="${e.malzFiyat!=null?fnum(e.malzFiyat):''}" oninput="setPrice('${f.id}','${e.id}','malzFiyat',this.value)"><em>₺</em></div></div>`:''}
              <div class="pr"><label>İşçilik Fiyatı :</label><div class="inw"><input inputmode="decimal" placeholder="Fiyat" value="${e.iscFiyat!=null?fnum(e.iscFiyat):''}" oninput="setPrice('${f.id}','${e.id}','iscFiyat',this.value)"><em>₺</em></div></div>
              <div class="tbox"><div class="tw"><div class="tl">Toplam Fiyat :</div><div class="tv" id="t_${e.id}">${e.toplam!=null?fnum(e.toplam)+' ₺':'Fiyat'}</div></div>
              <button class="btn green" onclick="calcTot('${f.id}','${e.id}')">Toplam Fiyat</button></div></div></div>`;
            });
            $('#app').innerHTML=h+'<div style="height:140px"></div></div>';
            $('#fab').innerHTML=ic('check',32);
            $('#fab').style.display='flex';
            if(view.scrollLast&&f.entries.length){view.scrollLast=false;setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),60)}
          }
          function setPrice(fid,eid,k,v){
            const e=getFile(fid).entries.find(x=>x.id===eid);
            e[k]=pnum(v);e.toplam=null;save();
            const t=$('#t_'+eid);if(t)t.textContent='Fiyat';
          }
          function calcTot(fid,eid){
            const e=getFile(fid).entries.find(x=>x.id===eid);
            e.toplam=r2((e.malz.length?(e.malzFiyat||0):0)+(e.iscFiyat||0));
            save();$('#t_'+eid).textContent=fnum(e.toplam)+' ₺';
          }
          function srch(v){
            document.querySelectorAll('.entry').forEach(x=>x.classList.remove('hl'));
            v=v.trim();if(!v)return;
            const el=[...document.querySelectorAll('.entry')].find(x=>x.dataset.date.includes(v));
            if(el){el.classList.add('hl');el.scrollIntoView({behavior:'smooth',block:'center'})}
          }
          function editEntry(fid,eid){
            const e=getFile(fid).entries.find(x=>x.id===eid);
            view.edit={fid,eid};openModal(entryFormHtml(e,'saveEdit'));
          }
          function saveEdit(){
            const e=getFile(view.edit.fid).entries.find(x=>x.id===view.edit.eid);
            Object.assign(e,readFormVals());
            if(!e.malz.length)e.malzFiyat=null;
            e.toplam=null;
            if(e.status&&e.status!=='done'){if(e.job&&e.job.img)idbDel(e.job.img);e.status='done';e.job=null}
            save();closeModal();render();
          }
          function delEntry(fid,eid){
            if(!confirm('Bu madde silinsin mi?'))return;
            const f=getFile(fid);const e=f.entries.find(x=>x.id===eid);
            if(e&&e.job&&e.job.img)idbDel(e.job.img);
            f.entries=f.entries.filter(x=>x.id!==eid);save();render();
          }

          /* ===== Toplama ===== */
          function startSum(){
            const f=getFile(view.id);const np=f?f.entries.filter(e=>!isDone(e)).length:0;
            openModal(`<h3>Tüm veriler toplansın mı?</h3>${np?`<p class="small">${np} madde henüz okunmadı, toplamaya dahil edilmeyecek.</p>`:''}<div class="row" style="margin-top:10px"><button class="btn green" onclick="doSum()">Toplansın</button><button class="btn ghost" onclick="closeModal()">İptal</button></div>`);
          }
          function doSum(){
            const f=getFile(view.id);
            const es=f.entries.filter(isDone);
            if(!es.length){closeModal();toast('Dosyada madde yok');return}
            const lines=es.map((e,i)=>({n:f.entries.indexOf(e)+1,date:e.date,val:entryTotal(e)}));
            const ts=es.map(e=>e.ts);
            const s={id:uid(),first:fdate(Math.min(...ts)),last:fdate(Math.max(...ts)),lines,total:r2(lines.reduce((a,l)=>a+l.val,0)),ts:Date.now()};
            f.summaries=f.summaries||[];f.summaries.push(s);save();
            closeModal();render();editSummary(f.id,s.id);
          }
          function editSummary(fid,sid){
            const s=getFile(fid).summaries.find(x=>x.id===sid);
            view.sum={fid,sid};
            let h=`<h3>Toplama Formu</h3>
            <label class="small">İlk veri tarihi</label><input id="s_first" value="${esc(s.first)}">
            <label class="small">Son veri tarihi</label><input id="s_last" value="${esc(s.last)}">
            <p class="small">Her maddenin toplam fiyatı (yalnızca bunlar toplanır, işçilik ve malzeme ayrıca eklenmez):</p>`;
            s.lines.forEach((l,i)=>h+=`<div class="pr"><label style="min-width:112px">${l.n}) ${esc(l.date)}</label><div class="inw"><input inputmode="decimal" class="s_l" data-i="${i}" value="${fnum(l.val)}" oninput="sumRecalc()"><em>₺</em></div></div>`);
            h+=`<label class="small">Toplam fiyat</label><div class="inw"><input id="s_total" value="${fnum(s.total)}" style="font-weight:800;font-size:20px"><em style="top:13px">₺</em></div>
            <div class="row" style="margin-top:14px"><button class="btn green" onclick="saveSum()">Kaydet</button><button class="btn red" onclick="delSum()">Formu sil</button><button class="btn ghost" onclick="closeModal()">Kapat</button></div>`;
            openModal(h);
          }
          function sumRecalc(){
            let t=0;document.querySelectorAll('.s_l').forEach(i=>t+=pnum(i.value)||0);
            $('#s_total').value=fnum(r2(t));
          }
          function saveSum(){
            const s=getFile(view.sum.fid).summaries.find(x=>x.id===view.sum.sid);
            s.first=$('#s_first').value;s.last=$('#s_last').value;
            document.querySelectorAll('.s_l').forEach(i=>s.lines[i.dataset.i].val=pnum(i.value)||0);
            s.total=pnum($('#s_total').value)||0;
            save();closeModal();render();
          }
          function delSum(){
            if(!confirm('Form silinsin mi?'))return;
            const f=getFile(view.sum.fid);f.summaries=f.summaries.filter(x=>x.id!==view.sum.sid);save();closeModal();render();
          }
          (function(){
            const b=$('#fab');let sx,sy,ox,oy,moved=false,drag=false;
            b.addEventListener('pointerdown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;const r=b.getBoundingClientRect();ox=r.left;oy=r.top;b.setPointerCapture(e.pointerId)});
            b.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
              if(moved){b.style.left=Math.max(0,Math.min(innerWidth-64,ox+dx))+'px';b.style.top=Math.max(0,Math.min(innerHeight-64,oy+dy))+'px';b.style.right='auto';b.style.bottom='auto'}});
            b.addEventListener('pointerup',()=>{drag=false;if(!moved)startSum()});
          })();

          /* ===== Paylaşma: salt okunur PDF ===== */
          function toB64(u8){let s='';const n=0x8000;for(let i=0;i<u8.length;i+=n)s+=String.fromCharCode.apply(null,u8.subarray(i,i+n));return btoa(s)}
          function downloadBytes(name,bytes,mime){
            const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:mime}));a.download=name;
            document.body.appendChild(a);a.click();a.remove();
          }
          async function shareBytes(name,bytes,mime,title){
            const C=CAP();
            if(C.Filesystem&&C.Share){
              try{
                const r=await C.Filesystem.writeFile({path:'paylas/'+name,data:toB64(bytes),directory:'CACHE',recursive:true});
                await C.Share.share({title:title,dialogTitle:'Paylaş',files:[r.uri]});
              }catch(e){if(!/cancel/i.test(String(e&&e.message||e)))throw e}
              return;
            }
            try{
              const file=new File([bytes],name,{type:mime});
              if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:title});return}
            }catch(e){if(e&&e.name==='AbortError')return}
            downloadBytes(name,bytes,mime);
          }
          async function shareFile(id){
            const f=getFile(id);
            if(!f.entries.some(isDone)&&!(f.summaries||[]).length){closeModal();toast('Paylaşılacak madde yok');return}
            closeModal();showLoader('PDF hazırlanıyor…');
            try{
              await sleep(60);
              const bytes=makePdf(buildPages(f));
              hideLoader();
              const name='TCDD_'+f.name.replace(/[^\w\-]+/g,'_')+'_'+fdate(Date.now()).replace(/\./g,'-')+'.pdf';
              await shareBytes(name,bytes,'application/pdf',f.name);
            }catch(e){hideLoader();alert('PDF oluşturulamadı: '+(e&&e.message||e))}
          }
          function wrapText(cx,text,maxW){
            const out=[];
            String(text==null?'':text).split('\n').forEach(par=>{
              if(!par.trim()){out.push('');return}
              let line='';
              par.trim().split(/\s+/).forEach(w=>{
                const t=line?line+' '+w:w;
                if(cx.measureText(t).width<=maxW){line=t;return}
                if(line)out.push(line);
                while(cx.measureText(w).width>maxW&&w.length>1){let k=w.length;while(k>1&&cx.measureText(w.slice(0,k)).width>maxW)k--;out.push(w.slice(0,k));w=w.slice(k)}
                line=w;
              });
              if(line)out.push(line);
            });
            return out;
          }
          function buildPages(f){
            const W=1240,H=1754,M=76,LIM=H-120,NAVY='#0f2744',RED='#c8102e',INK='#1c2430',MUT='#6b7686';
            const pages=[];let cv=null,cx=null,y=0;
            function newPage(){
              cv=document.createElement('canvas');cv.width=W;cv.height=H;cx=cv.getContext('2d');
              cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
              cx.fillStyle=NAVY;cx.fillRect(0,0,W,96);cx.fillStyle=RED;cx.fillRect(0,96,W,6);
              cx.textBaseline='middle';cx.fillStyle='#fff';cx.textAlign='left';cx.font='700 38px '+FONT;cx.fillText('TCDD Asistanı',M,50);
              cx.textAlign='right';cx.font='500 26px '+FONT;cx.fillText(f.name,W-M,50);
              cx.textBaseline='top';y=102+44;pages.push(cv);
            }
            const need=h=>{if(!cv||y+h>LIM)newPage()};
            function txt(s,font,color,x,align){cx.font=font;cx.fillStyle=color;cx.textAlign=align||'left';cx.fillText(s,x,y)}
            function para(s,font,color,lh,x,w){
              cx.font=font;
              wrapText(cx,s,w).forEach(l=>{need(lh);cx.font=font;txt(l,font,color,x);y+=lh});
            }
            function section(label,val){
              need(34+42);txt(label,'600 25px '+FONT,NAVY,M);y+=36;
              para(val&&String(val).trim()?val:'—','400 30px '+FONT,INK,43,M,W-2*M);y+=10;
            }
            function priceRow(label,v,strong){
              need(strong?64:52);
              if(strong){cx.fillStyle='#d9d3c3';cx.fillRect(M,y,W-2*M,2);y+=14}
              txt(label,(strong?'700 32px ':'600 28px ')+FONT,NAVY,M);
              const has=v!=null;
              txt(has?fnum(v)+' ₺':'Fiyat',(strong?'800 36px ':'700 30px ')+FONT,has?(strong?RED:INK):MUT,W-M,'right');
              y+=strong?52:46;
            }
            function estH(e){
              let t=90;
              const sec=v=>{cx.font='400 30px '+FONT;return 36+Math.max(1,wrapText(cx,v&&String(v).trim()?v:'—',W-2*M).length)*43+10};
              t+=sec(e.adres)+sec([e.tanim,e.islem].filter(x=>x&&x.trim()).join('\n'));
              if(e.malz.length){cx.font='400 30px '+FONT;t+=36+10+52;e.malz.forEach(m=>{t+=Math.max(1,wrapText(cx,m,W-2*M-34).length)*43})}
              return t+52+64+60;
            }
            newPage();
            const done=f.entries.map((e,i)=>({e,n:i+1})).filter(x=>isDone(x.e));
            txt(f.name,'800 52px '+FONT,NAVY,M);y+=70;
            txt(fileRange(f)+'   •   '+done.length+' madde','500 27px '+FONT,MUT,M);y+=60;
            done.forEach(({e,n})=>{
              {const hh=estH(e);if(!cv||(y+hh>LIM&&hh<LIM-170))newPage();else need(66+36+43*2)}
              cx.fillStyle='#f1ede1';cx.fillRect(M,y,W-2*M,68);
              cx.fillStyle=RED;cx.beginPath();cx.arc(M+38,y+34,27,0,Math.PI*2);cx.fill();
              cx.textBaseline='middle';cx.fillStyle='#fff';cx.textAlign='center';cx.font='800 30px '+FONT;cx.fillText(String(n),M+38,y+35);
              cx.textAlign='left';cx.fillStyle=INK;cx.font='700 34px '+FONT;cx.fillText(e.date,M+86,y+35);cx.textBaseline='top';
              y+=68+22;
              section('Adres :',e.adres);
              section('Yapılacak işin tanımı :',[e.tanim,e.islem].filter(x=>x&&x.trim()).join('\n'));
              if(e.malz.length){
                need(36+43);txt('Kullanılan malzemeler :','600 25px '+FONT,NAVY,M);y+=36;
                cx.font='400 30px '+FONT;
                e.malz.forEach(m=>{
                  const ls=wrapText(cx,m,W-2*M-34);
                  ls.forEach((l,i)=>{need(43);if(i===0){cx.fillStyle=RED;cx.beginPath();cx.arc(M+10,y+22,6,0,Math.PI*2);cx.fill()}txt(l,'400 30px '+FONT,INK,M+34);y+=43});
                });
                y+=10;
                need(52*3+30);priceRow('Malzeme Fiyatı :',e.malzFiyat);
              }
              need(52*2+30);priceRow('İşçilik Fiyatı :',e.iscFiyat);
              priceRow('Toplam Fiyat :',e.toplam,true);
              y+=26;need(10);cx.fillStyle='#e6e1d4';cx.fillRect(M,y,W-2*M,2);y+=34;
            });
            (f.summaries||[]).forEach(s=>{
              newPage();
              txt('Toplama Formu','800 50px '+FONT,NAVY,M);y+=74;
              txt('İlk veri tarihi: '+s.first+'     Son veri tarihi: '+s.last,'500 28px '+FONT,MUT,M);y+=58;
              s.lines.forEach(l=>{
                need(54);txt(l.n+') '+l.date,'600 30px '+FONT,INK,M);txt(fnum(l.val)+' ₺','700 30px '+FONT,INK,W-M,'right');
                y+=44;cx.fillStyle='#ece7d8';cx.fillRect(M,y,W-2*M,2);y+=10;
              });
              need(110);y+=16;cx.fillStyle='#fff3c2';cx.fillRect(M,y,W-2*M,86);cx.strokeStyle='#d9a400';cx.lineWidth=3;cx.strokeRect(M,y,W-2*M,86);
              y+=24;txt('Toplam Fiyat','700 34px '+FONT,NAVY,M+24);txt(fnum(s.total)+' ₺','800 40px '+FONT,RED,W-M-24,'right');y+=70;
            });
            pages.forEach((p,i)=>{
              const c=p.getContext('2d');c.textBaseline='middle';c.fillStyle='#8a93a1';c.font='500 24px '+FONT;
              c.textAlign='left';c.fillText('Oluşturulma: '+fdate(Date.now()),M,H-56);
              c.textAlign='right';c.fillText('Sayfa '+(i+1)+' / '+pages.length,W-M,H-56);
            });
            return pages;
          }
          function makePdf(pages){
            const enc=new TextEncoder();const chunks=[];let len=0;const offs=[];
            const push=b=>{if(typeof b==='string')b=enc.encode(b);chunks.push(b);len+=b.length};
            const imgs=pages.map(cv=>{
              const d=cv.toDataURL('image/jpeg',0.88).split(',')[1];const bin=atob(d);const u=new Uint8Array(bin.length);
              for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
              return {u,w:cv.width,h:cv.height};
            });
            const N=imgs.length;
            push('%PDF-1.4\n');
            offs[1]=len;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
            const kids=imgs.map((_,i)=>(5+3*i)+' 0 R').join(' ');
            offs[2]=len;push('2 0 obj\n<< /Type /Pages /Kids ['+kids+'] /Count '+N+' >>\nendobj\n');
            imgs.forEach((im,i)=>{
              const a=3+3*i,b=4+3*i,c=5+3*i;
              offs[a]=len;push(a+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.u.length+' >>\nstream\n');push(im.u);push('\nendstream\nendobj\n');
              const cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
              offs[b]=len;push(b+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
              offs[c]=len;push(c+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+a+' 0 R >> >> /Contents '+b+' 0 R >>\nendobj\n');
            });
            const total=3+3*N;const xr=len;
            let x='xref\n0 '+total+'\n0000000000 65535 f \n';
            for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
            push(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
            const out=new Uint8Array(len);let p=0;chunks.forEach(c=>{out.set(c,p);p+=c.length});
            return out;
          }

          /* ===== Hesap makinesi ===== */
          let ex='',last='';
          function renderCalc(){
            const keys=['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'];
            let h=topbar('Hesap Makinesi')+`<div class="wrap">
            <div id="disp"><small id="dl">${esc(last)}</small><span class="v" id="dv">${esc(ex||'0')}</span></div><div class="calc">`;
            keys.forEach(k=>{const c=k==='='?'eq':k==='C'||k==='⌫'?'cl':'÷×−+'.includes(k)?'op':'';h+=`<button class="${c}" onclick="ck('${k}')">${k}</button>`});
            h+=`</div><div class="row" style="margin:22px 0 10px"><b style="font-size:18px;flex:1">Geçmiş</b>${S.calc.length?`<button class="btn red" onclick="if(confirm('Tüm geçmiş silinsin mi?')){S.calc=[];save();render()}">Tümünü sil</button>`:''}</div>`;
            if(!S.calc.length)h+='<p class="small">Henüz işlem yok.</p>';
            S.calc.slice().reverse().forEach(c=>h+=`<div class="card row" style="padding:12px 14px;margin-bottom:10px"><div style="flex:1">${esc(c.e)} = <b>${esc(c.r)}</b></div><button class="sbtn d" onclick="delCalc('${c.id}')">${ic('trash',18)}</button></div>`);
            $('#app').innerHTML=h+'</div>';
          }
          function upd(){$('#dv').textContent=ex||'0';$('#dl').textContent=last}
          function ck(k){
            if(k==='C'){ex='';last=''}
            else if(k==='⌫')ex=ex.slice(0,-1);
            else if(k==='='){
              if(!ex)return;
              try{
                const js=ex.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
                if(!/^[0-9+\-*/.() ]+$/.test(js))throw 0;
                let r=Function('"use strict";return ('+js+')')();
                if(!isFinite(r))throw 0;
                r=Math.round(r*1e10)/1e10;
                S.calc.push({id:uid(),e:ex,r:String(r)});save();
                last=ex+' =';ex=String(r);renderCalc();return;
              }catch(e){last='Hata';ex=''}
            }else ex+=k;
            upd();
          }
          function delCalc(id){S.calc=S.calc.filter(c=>c.id!==id);save();renderCalc()}

          /* ===== açılış ekranı: 3 saniye ===== */
          (function(){
            const sp=document.getElementById('splash');if(!sp)return;
            const logo=LOGO.replace('class="logo"','class="slogo"').replace('id="lg"','id="lgs"').replace('url(#lg)','url(#lgs)');
            sp.innerHTML='<div class="sglow"></div>'+logo+'<h1 class="stitle"><span>Hüseyin Çalışır</span><span>Hayratıdır</span></h1><div class="sdiv"><i></i><b></b><i></i></div><div class="ssub">Duanızı Eksık Etmeyiniz</div>';
            setTimeout(()=>{sp.classList.add('out');setTimeout(()=>{if(sp.parentNode)sp.parentNode.removeChild(sp)},450)},3000);
          })();

          render();
          resumeAll();
          </script>
          </body>
          </html>
